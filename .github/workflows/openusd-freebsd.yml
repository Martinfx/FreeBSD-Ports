# Build graphics/openusd natively in FreeBSD VMs and run its whole test
# suite ("make test") as a regular user, with Xvfb for the imaging tests.
name: openusd on FreeBSD

on:
  push:
    branches:
      - claude/wizardly-planck-x8qjze
    paths:
      - 'openusd/**'
      - '.github/workflows/openusd-freebsd.yml'

concurrency:
  group: openusd-freebsd-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        # 15.1 is what the port is used on; "14" is the newest 14.x
        release: ["15.1", "14"]
    steps:
      - uses: actions/checkout@v4

      - name: Keep the VM on the large temporary disk
        run: |
          df -h / /mnt
          sudo mkdir -p /mnt/vm
          sudo chown "$(id -u):$(id -g)" /mnt/vm

      - name: Build and test graphics/openusd on FreeBSD ${{ matrix.release }}
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          cpu: 4
          mem: 12288
          data-dir: /mnt/vm
          prepare: |
            set -e
            # use the latest packages; the repository is "FreeBSD" on 14.x and
            # "FreeBSD-ports" on 15.x
            R=FreeBSD
            grep -q '^FreeBSD-ports:' /etc/pkg/FreeBSD.conf && R=FreeBSD-ports
            mkdir -p /usr/local/etc/pkg/repos
            echo "$R: { url: \"pkg+https://pkg.FreeBSD.org/\${ABI}/latest\", mirror_type: \"srv\" }" \
              > /usr/local/etc/pkg/repos/$R.conf
            cat /usr/local/etc/pkg/repos/$R.conf
            env ASSUME_ALWAYS_YES=yes pkg update -f
            env ASSUME_ALWAYS_YES=yes pkg upgrade
            pkg install -y git-lite xorg-vfbserver mesa-dri
            git clone --depth 1 https://github.com/freebsd/freebsd-ports.git /usr/ports
          run: |
            set -e
            L=$PWD/ci-logs
            mkdir -p $L
            uname -a | tee $L/uname.txt
            df -h / | tee -a $L/uname.txt
            for p in materialx openusd; do
              rm -rf /usr/ports/graphics/$p
              cp -R $p /usr/ports/graphics/$p
            done
            # graphics/materialx of this repository, which installs the data
            # libraries USD needs (the shader source code)
            echo "=== $(date) building materialx"
            cd /usr/ports/graphics/materialx
            make DEPENDS_SHOW_FLAVOR=yes build-depends-list run-depends-list | \
              sed 's|^/usr/ports/||' | sort -u > $L/materialx-deps.txt
            pkg install -y $(cat $L/materialx-deps.txt) > $L/materialx-deps.log 2>&1 || \
              { tail -n 100 $L/materialx-deps.log; exit 1; }
            make BATCH=yes stage > $L/materialx.log 2>&1 || \
              { grep -n -E ' error: |Error [0-9]+|CMake Error' $L/materialx.log | head -n 50; \
                tail -n 50 $L/materialx.log; exit 1; }
            make check-plist 2>&1 | tail -n 30
            make install > $L/materialx-install.log 2>&1 || \
              { tail -n 50 $L/materialx-install.log; exit 1; }
            ls /usr/local/share/MaterialX /usr/local/share/MaterialX/libraries
            cd /usr/ports/graphics/openusd
            echo "=== $(date) installing dependencies"
            # direct dependencies only; pkg pulls in their own run dependencies
            make DEPENDS_SHOW_FLAVOR=yes build-depends-list run-depends-list \
              test-depends-list | sed 's|^/usr/ports/||' | \
              grep -v '^graphics/materialx$' | sort -u > $L/deps.txt
            cat $L/deps.txt
            pkg install -y $(cat $L/deps.txt) > $L/deps.log 2>&1 || \
              { tail -n 100 $L/deps.log; exit 1; }
            pkg info -q | sort > $L/packages.txt
            pw useradd builder -m -s /bin/sh
            mkdir -p /home/builder/wrk /home/builder/distfiles
            chown -R builder /home/builder
            echo "=== make as builder"
            su -m builder -c 'id; env HOME=/home/builder make \
                WRKDIRPREFIX=/home/builder/wrk -V PKGNAME -V WRKDIR -V PORT_OPTIONS'
            # keep core dumps of crashing tests for backtraces
            mkdir -p /tmp/cores && chmod 1777 /tmp/cores
            sysctl kern.corefile=/tmp/cores/%N.%P.core
            # -noreset: the X server resets when its last client disconnects,
            # and closes the connections of the clients that are connecting
            # then, so XOpenDisplay() failed now and then with the tests
            # running in parallel (in run 11, in 4 tests on 15.1 and 5 on 14)
            Xvfb :99 -screen 0 1280x1024x24 -ac -noreset +extension GLX > $L/xvfb.log 2>&1 &
            export DISPLAY=:99
            # Mesa's llvmpipe (the GL of Xvfb) renders without its worker
            # threads: they crash when a process exits while its libraries
            # are finalized (SIGSEGV in llvmpipe-N while exit() runs the
            # destructors, in the backtraces of all 12 GL test programs that
            # dumped core in run 9), and with the parallel tests they made
            # "make test" slower (on 15.1 it did not finish in 280 minutes,
            # instead of 3 hours without them)
            export LP_NUM_THREADS=0
            # make test as builder, which then ends the processes that the
            # tests left running (listed as "left running:"): timeout(1)
            # waits until all the processes started under it have exited,
            # and in run 10 it waited for them until its time limit (on
            # 15.1 two hours after the last test)
            cat > /home/builder/make-test.sh <<'EOF'
            ulimit -c unlimited
            env HOME=/home/builder make BATCH=yes WRKDIRPREFIX=/home/builder/wrk \
              DISTDIR=/home/builder/distfiles test "$@"
            rc=$?
            # all processes of builder except this shell (pgrep leaves out
            # its ancestors)
            p=$(pgrep -U builder)
            if [ -n "$p" ]; then
              ps -ww -o pid,ppid,etime,args -p "$(echo $p | tr ' ' ,)" | \
                sed 's/^/left running: /'
              kill $p
              sleep 5
              kill -9 $p
            fi 2>/dev/null
            exit $rc
            EOF
            echo "=== $(date) make test"
            set +e
            # stop in time to copy the logs out of the VM before the job's
            # time limit
            ( timeout -k 2m 300m su -m builder -c 'sh /home/builder/make-test.sh' \
                2>&1; echo $? > $L/rc.txt ) | tee $L/test.log | \
              grep --line-buffered -E '^===>|Built target|tests passed|Test +#|^left running'
            rc=$(cat $L/rc.txt 2>/dev/null || echo 99)
            echo "=== $(date) make test finished with $rc"
            # run the failed tests once more, which tells the failures that
            # come and go from the others
            if [ "$rc" != 0 ] && grep -q ' tests failed out of ' $L/test.log; then
              echo "=== $(date) failed tests again"
              ( timeout -k 2m 30m su -m builder -c \
                  'sh /home/builder/make-test.sh CTEST_ARGS=--rerun-failed' \
                  2>&1; echo $? > $L/rc.txt ) > $L/rerun.log
              echo "=== $(date) rerun finished with $(cat $L/rc.txt)"
              sed -n '/tests passed, /,$p' $L/rerun.log | head -n 300
              echo "=== output of the tests that failed again (start)"
              awk '/\*\*\*(Failed|Exception|Timeout)/ { n = 40 } n-- > 0' $L/rerun.log | \
                head -n 6000
            fi
            echo "=== head"
            head -n 40 $L/test.log
            echo "=== errors"
            grep -n -E ' error: |Error [0-9]+|^FAILED:|CMake Error' $L/test.log | head -n 100 || true
            echo "=== ctest summary"
            sed -n '/tests passed, /,$p' $L/test.log | head -n 1500
            echo "=== output of the failed tests (start)"
            awk '/\*\*\*(Failed|Exception|Timeout)/ { n = 40 } n-- > 0' $L/test.log | \
              head -n 6000
            echo "=== tail"
            tail -n 60 $L/test.log
            echo "=== Xvfb"
            pgrep -l Xvfb
            tail -n 40 $L/xvfb.log
            echo "=== core dumps"
            ls -l /tmp/cores
            # one backtrace per program; the name in the core file name is
            # cut to 19 characters, so ask procstat for the executable
            for n in $(ls /tmp/cores | sed -E 's/\.[0-9]+\.core$//' | sort -u | head -n 40); do
              c=$(ls /tmp/cores/$n.*.core | head -n 1)
              exe=$(procstat binary $c 2>/dev/null | awk 'NR == 2 { print $NF }')
              echo "=== backtrace of $c ($exe, $(ls /tmp/cores/$n.*.core | wc -l) core files)"
              lldb --batch -c $c -o 'thread backtrace all' -- "$exe" 2>&1 | head -n 200
            done
            find /home/builder/wrk -name LastTest.log -exec cp {} $L/ \; || true
            chmod -R a+r $L
            # the logs are only copied out of the VM when this succeeds; the
            # result of make test is checked in a later step
            exit 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openusd-freebsd-${{ matrix.release }}-logs
          path: ci-logs/
          if-no-files-found: ignore

      - name: Result of make test
        run: |
          rc=$(cat ci-logs/rc.txt 2>/dev/null || echo 1)
          echo "make test finished with $rc"
          exit $rc

# Build graphics/cycles (5.x) of the "works" branch with the USD option (Hydra
# render delegate) in a FreeBSD 15.1 VM, check its plist, render a USD scene
# with the cycles program and with usdrecord through hdCycles, and compile
# GafferCycles (graphics/gaffer) with it.
name: cycles on FreeBSD

on:
  push:
    branches:
      - claude/wizardly-planck-x8qjze
    paths:
      - '.github/workflows/cycles-freebsd.yml'

concurrency:
  group: cycles-freebsd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        # pkg: openusd from the FreeBSD packages (no Python)
        # port: openusd built from graphics/openusd of this repository
        usd: [pkg, port]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: works

      - name: Keep the VM on the large temporary disk
        run: |
          sudo mkdir -p /mnt/vm
          sudo chown "$(id -u):$(id -g)" /mnt/vm
          git log --oneline -3

      - name: Build and test graphics/cycles (openusd from ${{ matrix.usd }})
        uses: vmactions/freebsd-vm@v1
        env:
          USD_FROM: ${{ matrix.usd }}
        with:
          release: "15.1"
          cpu: 4
          mem: 12288
          data-dir: /mnt/vm
          envs: 'USD_FROM'
          prepare: |
            set -e
            # use the latest packages; the repository is "FreeBSD" on 14.x and
            # "FreeBSD-ports" on 15.x
            R=FreeBSD
            grep -q '^FreeBSD-ports:' /etc/pkg/FreeBSD.conf && R=FreeBSD-ports
            mkdir -p /usr/local/etc/pkg/repos
            echo "$R: { url: \"pkg+https://pkg.FreeBSD.org/\${ABI}/latest\", mirror_type: \"srv\" }" \
              > /usr/local/etc/pkg/repos/$R.conf
            env ASSUME_ALWAYS_YES=yes pkg update -f
            env ASSUME_ALWAYS_YES=yes pkg upgrade
            pkg install -y git-lite xorg-vfbserver mesa-dri
            git clone --depth 1 https://github.com/freebsd/freebsd-ports.git /usr/ports
          run: |
            set -e
            # no options dialogs: "make check-plist" waited for one until the
            # job was killed
            export BATCH=yes
            W=$PWD
            L=$PWD/ci-logs
            mkdir -p $L
            echo "=== openusd from $USD_FROM"
            sysctl -n hw.ncpu hw.physmem; swapinfo -h
            # memory and swap once a minute, to see whether the build swaps
            ( while :; do echo "$(date +%T) free=$(sysctl -n vm.stats.vm.v_free_count) \
                $(swapinfo -h | tail -n 1)"; sleep 60; done ) > $L/mem.log 2>&1 &
            # progress of a build: the port stages, and the kernels and links
            # of ninja
            progress() {
              grep --line-buffered -E '^===>|^\[[0-9]+/[0-9]+\] (Linking|Building CXX object src/kernel/)|^\[[0-9]*00/' | \
                while read -r l; do echo "$(date +%T) $l"; done
            }
            for p in materialx openusd cycles; do
              rm -rf /usr/ports/graphics/$p
              cp -R $p /usr/ports/graphics/$p
            done
            # only the options needed by cycles, to save time
            USD_OPTS="OPTIONS_UNSET=DRACO EMBREE OCIO OIIO OPENVDB OSL PTEX"
            # direct dependencies only; pkg pulls in their run dependencies
            # (the options of openusd only for openusd: with EMBREE unset, the
            # list of cycles lacked graphics/embree, which its build then built
            # with ispc and llvm20 for 4.5 hours)
            deps() {
              p=$1; shift
              make -C /usr/ports/graphics/$p "$@" DEPENDS_SHOW_FLAVOR=yes \
                build-depends-list run-depends-list | sed 's|^/usr/ports/||' | \
                grep -v -E '^graphics/(materialx|openusd)$' | sort -u
            }
            if [ "$USD_FROM" = pkg ]; then
              pkg install -y openusd
            else
              # graphics/openusd of this repository needs the data libraries
              # of graphics/materialx of this repository
              deps materialx > $L/materialx-deps.txt
              pkg install -y $(cat $L/materialx-deps.txt) > $L/materialx-deps.log 2>&1 || \
                { tail -n 50 $L/materialx-deps.log; exit 1; }
              echo "=== $(date) building materialx"
              ( make -C /usr/ports/graphics/materialx BATCH=yes install \
                  2>&1 && echo 0 > $L/materialx.rc || echo $? > $L/materialx.rc ) | \
                tee $L/materialx.log | progress
              [ "$(cat $L/materialx.rc)" = 0 ] || \
                { grep -n -E ' error: |Error [0-9]+|^FAILED:|CMake Error' $L/materialx.log | head -n 50; \
                  tail -n 50 $L/materialx.log; exit 1; }
              deps openusd "$USD_OPTS" > $L/openusd-deps.txt
              pkg install -y $(cat $L/openusd-deps.txt) > $L/openusd-deps.log 2>&1 || \
                { tail -n 50 $L/openusd-deps.log; exit 1; }
              echo "=== $(date) building openusd"
              # (with set -e, only a && || list gets to record the status)
              ( make -C /usr/ports/graphics/openusd BATCH=yes "$USD_OPTS" install \
                  2>&1 && echo 0 > $L/openusd.rc || echo $? > $L/openusd.rc ) | \
                tee $L/openusd.log | progress
              [ "$(cat $L/openusd.rc)" = 0 ] || \
                { grep -n -E ' error: |Error [0-9]+|^FAILED:|CMake Error' $L/openusd.log | head -n 50; \
                  tail -n 50 $L/openusd.log; exit 1; }
            fi
            pkg info openusd
            deps cycles > $L/cycles-deps.txt
            cat $L/cycles-deps.txt
            pkg install -y $(cat $L/cycles-deps.txt) > $L/cycles-deps.log 2>&1 || \
              { tail -n 50 $L/cycles-deps.log; exit 1; }
            cd /usr/ports/graphics/cycles
            make -V PORT_OPTIONS -V PYTHON_VER
            echo "=== $(date) building cycles"
            # the kernels of Cycles need a lot of memory each
            ( timeout -k 2m 120m make MAKE_JOBS_NUMBER=3 stage 2>&1 && echo 0 > $L/cycles.rc || \
                echo $? > $L/cycles.rc ) | tee $L/cycles.log | progress
            [ "$(cat $L/cycles.rc)" = 0 ] || \
              { grep -n -A6 -E ' error: |Error [0-9]+|^FAILED:|CMake (Error|Warning)' $L/cycles.log | head -n 120; \
                tail -n 80 $L/cycles.log; tail -n 30 $L/mem.log; exit 1; }
            tail -n 5 $L/mem.log
            grep -i -E 'usd|hydra|python|pxr' $L/cycles.log | grep -E '^--|CMake' | head -n 30 || true
            echo "=== $(date) check-plist and stage-qa"
            # their problems, and the warnings of stage-qa about the
            # dependencies, fail the job at the end
            qa=0
            make check-plist > $L/check-plist.log 2>&1 || qa=1
            make stage-qa > $L/stage-qa.log 2>&1 || qa=1
            cat $L/check-plist.log $L/stage-qa.log
            if grep -q -E '^(Error|Warning):' $L/stage-qa.log; then qa=1; fi
            make install > $L/install.log 2>&1 || { tail -n 50 $L/install.log; exit 1; }
            cat /usr/local/plugin/usd/hdCycles/resources/plugInfo.json
            # the resource path, as used by hdCycles and Gaffer
            cat /usr/local/share/cycles/cycles_definitions.txt
            ls /usr/local/share/cycles /usr/local/share/cycles/shader | head -n 20
            test -f /usr/local/share/cycles/source/kernel/types.h || \
              { echo "share/cycles/source/kernel/types.h is missing"; exit 1; }
            # a shared library links even with undefined symbols, so check
            # that the plugin really depends on USD
            ldd /usr/local/plugin/usd/hdCycles.so | grep -E 'usd|python' || true
            ldd /usr/local/plugin/usd/hdCycles.so | grep -q libusd_ms.so || \
              { echo "hdCycles.so is not linked with libusd_ms.so"; exit 1; }
            # A red sphere lit by a distant light.  Without normalize, the
            # intensity of a DistantLight is the radiance of its disk (hence
            # the default of 50000 for the sun), and 3 lit the sphere so little
            # that Cycles rendered it black; with normalize it is about the
            # irradiance.
            cat > /tmp/test.usda <<'EOF'
            #usda 1.0
            (
                upAxis = "Y"
            )

            def Xform "World"
            {
                def Camera "cam"
                {
                    float focalLength = 35
                    double3 xformOp:translate = (0, 0, 8)
                    uniform token[] xformOpOrder = ["xformOp:translate"]
                }

                def Sphere "ball" (
                    prepend apiSchemas = ["MaterialBindingAPI"]
                )
                {
                    double radius = 2
                    rel material:binding = </World/red>
                }

                def Material "red"
                {
                    token outputs:surface.connect = </World/red/pbr.outputs:surface>

                    def Shader "pbr"
                    {
                        uniform token info:id = "UsdPreviewSurface"
                        color3f inputs:diffuseColor = (0.8, 0.05, 0.05)
                        token outputs:surface
                    }
                }

                def DistantLight "sun"
                {
                    float inputs:intensity = 3
                    bool inputs:normalize = true
                    float3 xformOp:rotateXYZ = (-30, 20, 0)
                    uniform token[] xformOpOrder = ["xformOp:rotateXYZ"]
                }
            }
            EOF
            # the sphere is red only if its material got through (the
            # statistics go to the log, the artifacts cannot always be read)
            red() {
              oiiotool "$1" --printstats | tee -a $L/stats.txt | \
                awk '/Stats (Min|Max|Avg)/ { print "  " $0 > "/dev/stderr" }
                     /Stats Avg/ { print ($3 > 2 * $4 && $3 > 0.02) ? "RED" : "NOT RED" }'
            }
            set +e
            rc=0
            [ $qa = 0 ] || { echo "check-plist or stage-qa: see above"; rc=1; }
            if [ "$USD_FROM" = pkg ]; then
              # openusd 26.05_3 of the ports tree does not find its plugins
              # on FreeBSD (no dladdr() in ArchGetAddressInfo(), and the path
              # of the executable comes from procfs), so opening a USD file
              # fails with "Failed to find the plugInfo.json file that
              # declares the plugin for ArDefaultResolver"; the openusd port
              # of this repository fixes that
              export PXR_PLUGINPATH_NAME=/usr/local/lib/usd:/usr/local/plugin/usd
            fi
            echo "=== $(date) cycles program"
            timeout 900 cycles --background --samples 16 --width 320 --height 240 \
              --output /tmp/standalone.png /tmp/test.usda > $L/standalone.log 2>&1
            echo "rc=$?"; tail -n 20 $L/standalone.log
            r=$(red /tmp/standalone.png); echo "standalone: $r"; [ "$r" = RED ] || rc=1
            # hdCycles warns about the material parameters it has no input
            # for (with USD 25.05 and later, the "typeName:" of each input
            # before files/patch-src_hydra_material.cpp)
            if grep 'Could not find parameter' $L/standalone.log; then rc=1; fi
            # when the sphere is not red: Cycles itself on one of its example
            # scenes, and the scene without its material (grey if the light
            # works; with the lights Cycles counts) and with a dome light
            if [ "$r" != RED ]; then
              echo "=== $(date) diagnostic renders"
              ex=$(make -C /usr/ports/graphics/cycles -V WRKSRC)/examples
              timeout 600 cycles --background --samples 16 --width 320 --height 200 \
                --output /tmp/cube.png $ex/scene_cube_surface.xml > $L/cube.log 2>&1
              echo "cube (no USD): rc=$? $(red /tmp/cube.png)"
              sed -e '/rel material:binding/d' /tmp/test.usda > /tmp/nomat.usda
              sed -e 's/def DistantLight "sun"/def DomeLight "sky"/' /tmp/test.usda > /tmp/dome.usda
              for s in nomat dome; do
                timeout 600 cycles --background --samples 16 --width 320 --height 240 \
                  --log-level info --output /tmp/$s.png /tmp/$s.usda > $L/$s.log 2>&1
                echo "$s: rc=$? $(red /tmp/$s.png)"
                grep -i -E 'warn|error|light' $L/$s.log | grep -v -i 'unable to read' | \
                  head -n 12
              done
            fi
            if [ "$USD_FROM" = port ]; then
              Xvfb :99 -screen 0 1280x1024x24 -ac +extension GLX > $L/xvfb.log 2>&1 &
              export DISPLAY=:99
              sleep 5
              echo "=== $(date) usdrecord with hdCycles"
              $(make -V PYTHON_CMD) -c \
                'from pxr import UsdImagingGL; print(UsdImagingGL.Engine.GetRendererPlugins())'
              # Only for information: hdCycles renders (the cycles program
              # above renders the same scene through the same code), but the
              # image usdrecord writes is empty (alpha 0 too), with the
              # frame recorder of USD 26.05 reading the color AOV.
              timeout 900 usdrecord --disableGpu --renderer Cycles --camera /World/cam \
                --imageWidth 320 /tmp/test.usda /tmp/usdrecord.png > $L/usdrecord.log 2>&1
              echo "rc=$?"; tail -n 20 $L/usdrecord.log
              echo "usdrecord: $(red /tmp/usdrecord.png)"
            fi
            cp /tmp/*.png $L/ 2>/dev/null
            echo "=== $(date) compile GafferCycles"
            # the sources of GafferCycles with the installed Cycles, as
            # graphics/gaffer builds them; its other dependencies are only
            # needed as headers (graphics/cortex is not in the ports tree)
            pkg install -y libfmt > $L/gaffercycles-deps.log 2>&1
            version() { sed -n 's/^DISTVERSION=[[:space:]]*//p' $W/$1/Makefile; }
            G=/tmp/gaffer
            C=/tmp/cortex
            git clone -q --depth 1 --branch $(version gaffer) \
              https://github.com/GafferHQ/gaffer.git $G
            git clone -q --depth 1 --branch $(version cortex) \
              https://github.com/ImageEngine/cortex.git $C
            (cd $G && for p in $W/gaffer/files/patch-*; do patch -s -p0 < $p; done)
            (cd $C && for p in $W/cortex/files/patch-*; do patch -s -p0 < $p; done)
            sed -e 's/!GAFFER_[A-Z]*_VERSION!/0/; s/!GAFFER_VERSION_SUFFIX!//' \
              $G/include/Gaffer/Version.h.in > $G/include/Gaffer/Version.h
            sed -i '' -e 's/IE_CORE_[A-Z]*VERSION/0/' $C/include/IECore/Version.h
            PYINC=$(make -C /usr/ports/graphics/cycles -V PYTHON_INCLUDEDIR)
            cat /usr/local/share/cycles/cycles_definitions.txt
            gc() {
              f=$1
              (
                # the definitions Cycles was built with, one argument each
                IFS='
            '
                set -- $(sed -e 's/^/-D/' /usr/local/share/cycles/cycles_definitions.txt)
                unset IFS
                exec c++ -std=c++17 -O2 -pipe -fPIC -fvisibility=hidden -c -o /dev/null \
                  -DBOOST_FILESYSTEM_VERSION=3 -DBOOST_FILESYSTEM_NO_DEPRECATED \
                  -DFMT_DEPRECATED= -DFMT_SHARED -DNDEBUG -DBOOST_DISABLE_ASSERTS \
                  -DBOOST_BIND_GLOBAL_PLACEHOLDERS -DBOOST_PYTHON_MAX_ARITY=20 \
                  -DGafferCycles_EXPORTS "$@" \
                  -I$G/include -isystem $C/include -isystem /usr/local/include \
                  -isystem /usr/local/include/Imath -isystem /usr/local/include/OpenEXR \
                  -isystem $PYINC $G/$f
              )
            }
            gcfail=0
            for f in $(cd $G && ls src/GafferCycles/*.cpp \
                src/GafferCycles/IECoreCyclesPreview/*.cpp src/GafferCyclesModule/*.cpp); do
              if gc $f > /tmp/gc.log 2>&1; then
                echo "ok $f"
              else
                echo "FAILED $f"; grep -m 10 'error' /tmp/gc.log; gcfail=1
                cat /tmp/gc.log >> $L/gaffercycles.log
              fi
            done
            [ $gcfail = 0 ] || rc=1
            echo $rc > $L/rc.txt
            chmod -R a+r $L
            # the logs are only copied out of the VM when this succeeds; the
            # result is checked in a later step
            exit 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycles-freebsd-${{ matrix.usd }}-logs
          path: ci-logs/
          if-no-files-found: ignore

      - name: Result
        run: |
          rc=$(cat ci-logs/rc.txt 2>/dev/null || echo 1)
          echo "the renders finished with $rc"
          exit $rc

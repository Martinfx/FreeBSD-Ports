# Build the maven repository distfile of devel/spark (spark-<version>-deps.tgz)
# natively in a FreeBSD 15.1 VM, the way "make -DMAINTAINER_MODE build
# make-deps" builds it, check that the port then builds offline from it, and
# upload it to the spark-<version> release, where MASTER_SITES:deps looks for
# it.  The job log ends with the distinfo and the staged file list for
# pkg-plist.
name: spark deps

on:
  push:
    branches:
      - claude/serene-gates-hmsxax
    paths:
      - '.github/workflows/spark-deps.yml'
  workflow_dispatch:

concurrency:
  group: spark-deps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Version and VM disk
        run: |
          sudo mkdir -p /mnt/vm
          sudo chown "$(id -u):$(id -g)" /mnt/vm
          V=$(awk '$1 == "PORTVERSION=" { print $2 }' spark/Makefile)
          echo "SPARK_VERSION=$V" >> "$GITHUB_ENV"
          echo "spark $V"
          df -h / /mnt

      - name: Build the maven repository on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          cpu: 4
          mem: 12288
          data-dir: /mnt/vm
          envs: 'SPARK_VERSION'
          prepare: |
            set -e
            R=FreeBSD
            grep -q '^FreeBSD-ports:' /etc/pkg/FreeBSD.conf && R=FreeBSD-ports
            mkdir -p /usr/local/etc/pkg/repos
            echo "$R: { url: \"pkg+https://pkg.FreeBSD.org/\${ABI}/latest\", mirror_type: \"srv\" }" \
              > /usr/local/etc/pkg/repos/$R.conf
            env ASSUME_ALWAYS_YES=yes pkg update -f
            env ASSUME_ALWAYS_YES=yes pkg upgrade
            pkg install -y git-lite bash maven openjdk17 openjdk21 pkgconf \
              protobuf python3 snappy-java
          run: |
            set -e
            W=$PWD
            V=$SPARK_VERSION
            D=spark-$V-deps.tgz
            mkdir -p $W/out
            freebsd-version; df -h /; sysctl -n hw.physmem hw.ncpu
            protoc --version; mvn --version

            git clone -q --depth 1 https://git.FreeBSD.org/ports.git /usr/ports
            cp -R spark /usr/ports/devel/spark
            cd /usr/ports/devel/spark
            export BATCH=yes

            # online build, which fills ${WRKDIR}/m2
            make -DMAINTAINER_MODE makesum
            make -DMAINTAINER_MODE build > $W/out/build-online.log 2>&1 || \
              { tail -n 300 $W/out/build-online.log; exit 1; }
            tail -n 60 $W/out/build-online.log
            make -DMAINTAINER_MODE make-deps
            cp /usr/ports/distfiles/$D $W/out/
            ls -l $W/out/$D

            # offline build from the deps tarball, like the package builders
            make clean
            make makesum
            cp distinfo $W/out/distinfo
            if make stage > $W/out/build-offline.log 2>&1; then
              tail -n 60 $W/out/build-offline.log
              (cd work/stage && find -s . -type f -o -type l | sed 's|^\./||') \
                > $W/out/staged-files.txt
              echo ok > $W/out/offline-status
            else
              tail -n 300 $W/out/build-offline.log
              echo failed > $W/out/offline-status
            fi
            df -h /

      - name: Upload to the spark-${{ env.SPARK_VERSION }} release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$SPARK_VERSION
          N=out/spark-$V-deps.tgz
          ls -l $N
          if gh release view spark-$V >/dev/null 2>&1; then
            gh release upload spark-$V $N --clobber
          else
            gh release create spark-$V $N --target "$GITHUB_SHA" \
              --title "spark $V maven repository" \
              --notes "Maven repository distfile (spark-$V-deps.tgz) for devel/spark $V, built on FreeBSD 15.1 amd64 by .github/workflows/spark-deps.yml."
          fi

      - name: distinfo and staged files
        run: |
          echo "== distinfo"
          cat out/distinfo
          echo "== offline build: $(cat out/offline-status)"
          echo "== staged files"
          cat out/staged-files.txt || true
          test "$(cat out/offline-status)" = ok

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-deps-logs
          path: |
            out/*.log
            out/distinfo
            out/staged-files.txt
          if-no-files-found: ignore

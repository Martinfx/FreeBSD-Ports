# Build devel/openvino natively in a FreeBSD 15.1 VM against the ports tree
# of the current quarterly branch, then test the package: regenerate distinfo
# (make makesum), stage, check-plist, package, install it and run the C++,
# benchmark_app and Python smoke tests from .github/openvino-smoke on the CPU
# plugin.
#
# The dependencies come from packages and the port is built with
# NO_DEPENDS, so a missing package shows up in missing-deps.txt instead of
# building the whole dependency tree.  The ccache directory is kept in the
# Actions cache, so a run that hits the time limit is picked up by the next.
name: openvino build

on:
  push:
    branches:
      - claude/epic-cannon-w4tdvn
    paths:
      - '.github/workflows/openvino-build.yml'
      - '.github/openvino-smoke/**'
      - 'openvino/**'
  workflow_dispatch:

concurrency:
  group: openvino-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: VM disk
        run: |
          sudo mkdir -p /mnt/vm
          sudo chown "$(id -u):$(id -g)" /mnt/vm
          mkdir -p ccache out
          df -h / /mnt

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ccache
          key: openvino-ccache-${{ github.run_id }}
          restore-keys: openvino-ccache-

      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          cpu: 4
          mem: 14336
          data-dir: /mnt/vm
          prepare: |
            set -e
            env ASSUME_ALWAYS_YES=yes pkg update -f
            pkg install -y git ccache
          run: |
            # the build runs in its own shell, whose status goes to out/status,
            # so that out/ and ccache/ are copied back from the VM also when it fails
            rc=0
            sh .github/openvino-smoke/ci-build.sh || rc=$?
            echo $rc > out/status

      - name: Result
        run: |
          echo "status $(cat out/status 2>/dev/null || echo missing)"
          [ "$(cat out/status 2>/dev/null)" = 0 ]

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ccache
          key: openvino-ccache-${{ github.run_id }}

      - name: Summary
        if: always()
        run: |
          {
            for f in distinfo missing-deps.txt check-plist.txt pkg-plist.diff smoke-cpp.txt benchmark-app.txt gpu-plugin-ldd.txt smoke-py.txt; do
              [ -f out/$f ] || continue
              echo "### $f"; echo '```'; cat out/$f; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openvino-build-logs
          path: out/
          if-no-files-found: ignore

# Build devel/openvino natively in a FreeBSD 15.1 VM against the ports tree
# of the current quarterly branch, then test the package: regenerate distinfo
# (make makesum), stage, check-plist, package, install it and run the C++ and
# Python smoke tests from .github/openvino-smoke on the CPU plugin.
#
# The dependencies come from packages and the port is built with
# NO_DEPENDS, so a missing package shows up in missing-deps.txt instead of
# building the whole dependency tree.  The ccache directory is kept in the
# Actions cache, so a run that hits the time limit is picked up by the next.
name: openvino build

on:
  push:
    branches:
      - claude/epic-cannon-w4tdvn
    paths:
      - '.github/workflows/openvino-build.yml'
      - '.github/openvino-smoke/**'
      - 'openvino/**'
  workflow_dispatch:

concurrency:
  group: openvino-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: VM disk
        run: |
          sudo mkdir -p /mnt/vm
          sudo chown "$(id -u):$(id -g)" /mnt/vm
          mkdir -p ccache out
          df -h / /mnt

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ccache
          key: openvino-ccache-${{ github.run_id }}
          restore-keys: openvino-ccache-

      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          cpu: 4
          mem: 14336
          data-dir: /mnt/vm
          prepare: |
            set -e
            env ASSUME_ALWAYS_YES=yes pkg update -f
            pkg install -y git ccache
          run: |
            # the script runs in a subshell and its status goes to
            # out/status, so that out/ and ccache/ are copied back from the
            # VM also when the build fails
            W=$PWD
            O=$W/out
            (
            set -e
            freebsd-version
            sysctl hw.ncpu hw.physmem
            df -h

            # the ports tree of the quarterly branch the packages come from
            Y=$(date -u +%Y)
            Q=$(( ($(date -u +%m | sed 's/^0//') - 1) / 3 + 1 ))
            git clone -q --depth 1 -b ${Y}Q$Q \
              https://github.com/freebsd/freebsd-ports.git /usr/ports < /dev/null
            echo "ports ${Y}Q$Q $(git -C /usr/ports log -1 --format=%h)"
            rm -rf /usr/ports/devel/openvino
            cp -R $W/openvino /usr/ports/devel/openvino
            P=/usr/ports/devel/openvino

            # the largest file system holds the work and distfiles
            B=$(df -k | awk 'NR > 1 && $1 !~ /^(devfs|tmpfs|fdescfs|procfs)/ { if ($4 > m) { m = $4; d = $6 } } END { print d }')
            echo "work on $B"
            mkdir -p $B/ovwork $B/distfiles
            export BATCH=yes DISTDIR=$B/distfiles WRKDIRPREFIX=$B/ovwork
            MK="make -C $P NO_DEPENDS=yes"

            $MK makesum < /dev/null
            cp $P/distinfo $O/distinfo
            cat $O/distinfo

            # dependencies from packages
            : > $O/missing-deps.txt
            for d in $($MK build-depends-list run-depends-list < /dev/null | \
                sed -e 's,^/usr/ports/,,' -e 's,@.*,,' | sort -u); do
              pkg install -y $d < /dev/null >> $O/pkg.log 2>&1 || echo $d >> $O/missing-deps.txt
            done
            echo "missing dependency packages:"; cat $O/missing-deps.txt

            export CCACHE_DIR=$W/ccache CCACHE_MAXSIZE=8G
            ccache -z > /dev/null
            df -h $B
            rc=0
            timeout 280m $MK WITH_CCACHE_BUILD=yes stage < /dev/null \
              > $O/build.log 2>&1 || rc=$?
            ccache -s | tee $O/ccache.txt
            df -h $B
            if [ $rc != 0 ]; then
              tail -n 300 $O/build.log
              echo "stage failed ($rc)"
              exit 1
            fi
            tail -n 20 $O/build.log

            status=0
            $MK stage-qa < /dev/null > $O/stage-qa.txt 2>&1 || status=1
            cat $O/stage-qa.txt
            $MK check-plist < /dev/null > $O/check-plist.txt 2>&1 || status=1
            cat $O/check-plist.txt
            $MK makeplist < /dev/null 2> /dev/null | \
              sed '1{/^\/you\/have\/to/d;}' > $O/pkg-plist.new || true
            diff -u $P/pkg-plist $O/pkg-plist.new > $O/pkg-plist.diff || true
            cat $O/pkg-plist.diff
            (cd $($MK -V STAGEDIR) && find . -name '*.so*' | sort) > $O/stage-libs.txt
            find $($MK -V WRKSRC)/bin -name '*.so' -path '*python*' | sort

            $MK package < /dev/null > $O/package.log 2>&1 || { tail -n 50 $O/package.log; exit 1; }
            PKGF=$($MK -V PKGFILE < /dev/null)
            ls -l $PKGF
            pkg add $PKGF < /dev/null
            pkg info -x openvino

            # smoke tests against the installed package
            S=$W/.github/openvino-smoke
            mkdir -p /tmp/smoke
            if c++ -std=c++17 -O1 -I/usr/local/include $S/smoke.cpp \
                -L/usr/local/lib -lopenvino -o /tmp/smoke/smoke > $O/smoke-cpp.txt 2>&1 && \
              /tmp/smoke/smoke /tmp/smoke/smoke.xml >> $O/smoke-cpp.txt 2>&1 < /dev/null; then
              echo "C++ smoke test OK"
            else
              echo "C++ smoke test FAILED"; status=1
            fi
            cat $O/smoke-cpp.txt
            PY=$($MK -V PYTHON_CMD < /dev/null)
            if (cd /tmp/smoke && $PY -I $S/smoke.py /tmp/smoke/smoke_py.xml) \
                > $O/smoke-py.txt 2>&1 < /dev/null; then
              echo "Python smoke test OK"
            else
              echo "Python smoke test FAILED"; status=1
            fi
            cat $O/smoke-py.txt
            exit $status
            )
            echo $? > $O/status

      - name: Result
        run: |
          echo "status $(cat out/status 2>/dev/null || echo missing)"
          [ "$(cat out/status 2>/dev/null)" = 0 ]

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ccache
          key: openvino-ccache-${{ github.run_id }}

      - name: Summary
        if: always()
        run: |
          {
            for f in distinfo missing-deps.txt check-plist.txt pkg-plist.diff smoke-cpp.txt smoke-py.txt; do
              [ -f out/$f ] || continue
              echo "### $f"; echo '```'; cat out/$f; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openvino-build-logs
          path: out/
          if-no-files-found: ignore

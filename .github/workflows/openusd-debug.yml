# FreeBSD reproducer for single openusd test failures: builds the
# monolithic library with imaging and the tests from the 26.05 sources with
# the patches of the "works" branch, and runs the failing tests under lldb,
# printing the backtraces of crashes.
name: openusd FreeBSD debug

on:
  push:
    branches:
      - claude/wizardly-planck-x8qjze
    paths:
      - '.github/workflows/openusd-debug.yml'

concurrency:
  group: openusd-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: works

      - name: Keep the VM on the large temporary disk
        run: |
          sudo mkdir -p /mnt/vm
          sudo chown "$(id -u):$(id -g)" /mnt/vm
          git log --oneline -3

      - name: Reproduce on FreeBSD 15.1
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          cpu: 4
          mem: 12288
          data-dir: /mnt/vm
          prepare: |
            set -e
            # use the latest packages; the repository is "FreeBSD" on 14.x and
            # "FreeBSD-ports" on 15.x
            R=FreeBSD
            grep -q '^FreeBSD-ports:' /etc/pkg/FreeBSD.conf && R=FreeBSD-ports
            mkdir -p /usr/local/etc/pkg/repos
            echo "$R: { url: \"pkg+https://pkg.FreeBSD.org/\${ABI}/latest\", mirror_type: \"srv\" }" \
              > /usr/local/etc/pkg/repos/$R.conf
            cat /usr/local/etc/pkg/repos/$R.conf
            env ASSUME_ALWAYS_YES=yes pkg update -f
            pkg install -y cmake-core ninja onetbb python312 opensubdiv \
              libglvnd mesa-libs mesa-dri libX11 libXext libXt xorg-vfbserver
          run: |
            set -e
            R=$PWD
            freebsd-version -ku; sysctl -n hw.ncpu hw.model
            mkdir -p /root/usd && cd /root/usd
            fetch -q -o usd.tar.gz \
              https://codeload.github.com/PixarAnimationStudios/OpenUSD/tar.gz/refs/tags/v26.05
            tar -xzf usd.tar.gz
            cd OpenUSD-26.05
            for p in $R/openusd/files/patch-*; do patch -p0 -s < $p; done
            # -g1: line numbers in the backtraces
            cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/root/usd/inst \
              "-DCMAKE_CXX_FLAGS_RELEASE=-O2 -g1 -DNDEBUG" \
              "-DCMAKE_C_FLAGS_RELEASE=-O2 -g1 -DNDEBUG" \
              -DPXR_BUILD_MONOLITHIC=ON -DPXR_BUILD_TESTS=ON \
              -DPXR_BUILD_IMAGING=ON -DPXR_BUILD_USD_IMAGING=OFF \
              -DPXR_BUILD_EXEC=OFF -DPXR_BUILD_USD_VALIDATION=OFF \
              -DPXR_ENABLE_PYTHON_SUPPORT=OFF \
              -DPYTHON_EXECUTABLE=/usr/local/bin/python3.12 \
              -DPXR_ENABLE_MATERIALX_SUPPORT=OFF -DPXR_ENABLE_PTEX_SUPPORT=OFF \
              -DPXR_BUILD_USD_TOOLS=OFF -DPXR_BUILD_EXAMPLES=OFF \
              -DPXR_BUILD_TUTORIALS=OFF > /tmp/cmake.log 2>&1 || \
              { tail -n 50 /tmp/cmake.log; exit 1; }
            echo "=== $(date) building"
            ninja -C build install > /tmp/build.log 2>&1 || \
              { grep -E 'error|FAILED' /tmp/build.log | head -n 50; exit 1; }
            echo "=== $(date) testSdfPathThreading"
            T=/root/usd/inst/tests/testSdfPathThreading
            set +e
            for n in 4 32; do
              for i in 1 2 3 4; do
                lldb --batch -o "run --numThreads $n" \
                  -k "thread backtrace all" -k "quit 1" -- $T > /tmp/lldb.txt 2>&1
                if grep -q 'stop reason' /tmp/lldb.txt; then
                  echo "=== crash with --numThreads $n (run $i)"
                  head -n 60 /tmp/lldb.txt
                  break
                fi
                echo "numThreads=$n run=$i: $(grep -E '^Ran ' /tmp/lldb.txt)"
              done
            done
            echo "=== $(date) testHdStBasicDrawing"
            mkdir -p /tmp/cores && chmod 1777 /tmp/cores
            sysctl kern.corefile=/tmp/cores/%N.%P.core
            ulimit -c unlimited
            Xvfb :99 -screen 0 1280x1024x24 -ac +extension GLX > /tmp/xvfb.log 2>&1 &
            export DISPLAY=:99
            sleep 5
            mkdir -p /tmp/hdst && cd /tmp/hdst
            for args in "--offscreen --repr hull --write hull.png" \
                "--offscreen --lighting --repr refined --refineLevel 1 --write refined.png"; do
              echo "=== testHdStBasicDrawing $args"
              env TF_DEBUG=HD_SAFE_MODE HD_ENABLE_OPENSUBDIV3_ADAPTIVE=1 \
                lldb --batch -o "run $args" -k "bt" -k "quit 1" \
                -- /root/usd/inst/tests/testHdStBasicDrawing 2>&1 | head -n 150
            done
            echo "=== $(date) ctest of the Hd tests"
            cd /root/usd/OpenUSD-26.05/build
            ctest -R '^testHd' -j4 --timeout 600 > /tmp/ctest.log 2>&1
            sed -n '/tests passed, /,$p' /tmp/ctest.log
            echo "=== backtraces of the crashed tests"
            ls /tmp/cores
            for n in $(ls /tmp/cores | sed -E 's/\.[0-9]+\.core$//' | sort -u); do
              c=$(ls /tmp/cores/$n.*.core | head -n 1)
              # the name in the core file name is cut to 19 characters
              exe=$(procstat binary $c 2>/dev/null | awk 'NR == 2 { print $NF }')
              echo "=== backtrace of $c ($exe)"
              lldb --batch -c $c -o bt -- "$exe" 2>&1 | head -n 80
            done
            # the whole state of one crashed test, e.g. whether the main
            # thread was exiting when a llvmpipe thread crashed
            c=$(ls /tmp/cores/testHdStBasicDrawin.*.core 2>/dev/null | head -n 1)
            if [ -n "$c" ]; then
              echo "=== all threads of $c"
              lldb --batch -c $c -o 'thread backtrace all' \
                -- /root/usd/inst/tests/testHdStBasicDrawing 2>&1 | head -n 150
            fi
            echo "=== $(date) failed tests again, one at a time"
            rm -f /tmp/cores/*
            ctest --rerun-failed -j1 --output-on-failure > /tmp/rerun.log 2>&1
            sed -n '/tests passed, /,$p' /tmp/rerun.log
            grep -m 3 -A 30 'testHdStBasicDrawing.*\*\*\*Failed' /tmp/rerun.log
            grep -A 30 'testHdxPickResolveMode.*\*\*\*Failed' /tmp/rerun.log | head -n 40
            echo "=== $(date) failed tests again, without llvmpipe threads"
            env LP_NUM_THREADS=0 ctest --rerun-failed -j1 --output-on-failure \
              > /tmp/rerun0.log 2>&1
            sed -n '/tests passed, /,$p' /tmp/rerun0.log
            exit 0
